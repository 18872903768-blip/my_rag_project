[project]
name = "recipe-rag"
version = "0.1.0"
description = "CPU-friendly Chinese recipe RAG baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core==1.5.4",
    "langchain-community==0.4.2",
    "langchain-huggingface==1.2.2",
    "langchain-text-splitters==1.1.2",
    "langchain-deepseek==1.1.0",
    "langchain-openai==1.3.5",
    "sentence-transformers==5.6.0",
    "faiss-cpu==1.14.3",
    "pymilvus==2.5.14",
    "langgraph==1.2.11",
    "rank-bm25==0.2.2",
    "python-dotenv==1.2.2",
    "fastapi==0.141.1",
    "uvicorn==0.40.0",
    "pyjwt==2.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "ragas==0.4.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    ".uv-cache",
    "__pycache__",
    "vector_index",
    "rag_modules_old",
    "main_old.py",
    "config_old.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的依赖注入以 Depends(...) 作为参数默认值，是官方推荐写法
"api/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
exclude = "(rag_modules_old|main_old.py|config_old.py)"
